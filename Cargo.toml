[workspace]
resolver = "3"
members = ["lsp", "sf_formula_parser"]

[workspace.dependencies]
anyhow = { version = "1.0.*", features = ["backtrace"] }
paste = "1.0.*"
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
serde_repr = "0.1.*"
tracing = "0.1.*"
tracing-subscriber = { version = "0.3.*", features = ["chrono"] }
